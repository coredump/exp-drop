name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck + lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install dependencies
        run: nix develop -c npm ci

      - name: Run quality checks
        run: nix develop -c npm run quality

      # Separate from `quality` so a coverage regression is distinguishable
      # from a lint/type/test failure at a glance.
      - name: Check coverage thresholds
        run: nix develop -c npm run test:coverage
